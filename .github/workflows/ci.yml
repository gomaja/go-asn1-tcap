name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
      - name: diff check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has a zero `before`, and a force push can leave it
          # unreachable. Without a merge base, check the last commit alone,
          # against its first parent, so that a merge commit is checked too.
          if [ -n "$BASE" ] && git merge-base "$BASE" HEAD >/dev/null 2>&1; then
            git diff --check "$BASE...HEAD"
          elif git rev-parse -q --verify 'HEAD^' >/dev/null; then
            git diff --check 'HEAD^' HEAD
          else
            git diff-tree --check --root --no-commit-id -r HEAD
          fi

  build-test:
    name: build-test / Go ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum is the go directive of go.mod. A version range such
          # as 1.26.x can resolve to an older cached patch release, which
          # the directive rejects.
          - name: minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1 -timeout 900s

  test-race:
    name: test race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go test -race
        run: go test ./... -race -count=1 -timeout 900s

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Vet
        run: go vet ./...
      - name: cross vet
        run: |
          for target in linux/386 linux/arm linux/s390x linux/mips; do
            echo "== $target =="
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go vet ./...
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: v0.8.2
          install-go: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  portability:
    name: portability / ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: cross-build-linux-386
            os: ubuntu-latest
            command: GOOS=linux GOARCH=386 CGO_ENABLED=0 go build ./...
          - kind: cross-build-linux-arm
            os: ubuntu-latest
            command: GOOS=linux GOARCH=arm CGO_ENABLED=0 go build ./...
          - kind: cross-build-linux-s390x
            os: ubuntu-latest
            command: GOOS=linux GOARCH=s390x CGO_ENABLED=0 go build ./...
          - kind: cross-build-linux-mips
            os: ubuntu-latest
            command: GOOS=linux GOARCH=mips CGO_ENABLED=0 go build ./...
          - kind: macos
            os: macos-latest
            command: go test ./... -count=1 -timeout 900s
          - kind: windows
            os: windows-latest
            command: go test ./... -count=1 -timeout 900s
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go
        run: ${{ matrix.command }}

  module:
    name: module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Fuzz each target briefly
        run: |
          for target in FuzzParse FuzzParseError FuzzParsePAbortCause FuzzOID; do
            go test . -run '^$' -fuzz "^${target}\$" -fuzztime 15s
          done
